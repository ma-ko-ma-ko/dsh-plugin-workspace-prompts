# This file IS the bundle's patch layer: `package.json` declares it under
# `dsh.bundle.patch`, so enabling this package as a bundle applies the row below
# to the profile automatically — there is nothing to copy by hand.
#
# It is also the exact row to paste if you would rather mount the plugin without
# the bundle route. `$DSH_HOME/profiles/<your-profile>/cordis.patch.yml` takes a
# top-level array of loader patch entries, and a *new* row is added through an
# `insert` list; a bare `- id: ...` entry is an update to an existing row and
# would be rejected with "entry not found".
#
# Every field under `config` is optional. `file` defaults to
# `$DSH_HOME/workspace-prompts.json`; a relative value is anchored to the profile
# directory when the host supplies one, so pin an absolute path if the exact
# location matters to you.
- insert:
    - id: workspace-prompts
      name: dsh-plugin-workspace-prompts
      config:
        # file: ./workspace-prompts.json
        # includeWorkspaceHeader: true
        # sectionTitle: Workspace instructions
        # order: 500
        # maxPromptBytes: 32768
        # registerTools: true
        # registerHttp: true
        # prompts:
        #   '*': Standing instructions that apply to every workspace.
        #   'F:\projects\api': Instructions injected for sessions under that directory.
